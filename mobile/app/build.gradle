apply plugin: 'com.android.application'
android {
    namespace "com.usinop.concrestats"
    compileSdk 34
    defaultConfig {
        applicationId "com.usinop.concrestats"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "2.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    // o appcompat ja' traz androidx.core, de onde vem o FileProvider
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
